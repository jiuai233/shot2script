name: Offline production checks
on:
  push:
    branches: [feat/deepseek-production-pipeline]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare dependencies for isolated offline tests
        run: python -m pip download --no-deps --only-binary=:all: --dest test-wheels 'scenedetect==0.6.7.1' 'sherpa-onnx==1.13.8' 'sherpa-onnx-core==1.13.8'
      - uses: actions/upload-artifact@v4
        with:
          name: offline-test-wheels
          path: test-wheels/
          retention-days: 1
