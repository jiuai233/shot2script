[project]
name = "s2s"
version = "0.1.0"
description = "短剧视频逐镜头画声转写工具"
requires-python = ">=3.12"
dependencies = [
    "pytest>=8",
    "jsonschema>=4",
    "httpx>=0.27",
    "pillow>=10",
    "lxml>=5",
    "python-docx>=1.1",
    "scenedetect[opencv]>=0.6,<0.7",
    "python-dotenv>=1",
    "rapidfuzz>=3",
    "sherpa-onnx==1.13.8",
    "numpy>=2",
    "sherpa-onnx-core==1.13.8",
    "pypinyin>=0.55.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools/s2s"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: 实际调用模型，需要本机运行器和可用的模型授权"]
addopts = "-ra"
